# Mosquitto broker config for the iot_logger project (Крок 8).
#
# Two listeners on purpose:
#   1883/tcp        -- plain MQTT, used by the ESP32 firmware (mqtt_link.c)
#   9001/websockets -- MQTT-over-WebSocket, used by web/templates/html/dashboard.html
#
# allow_anonymous true is fine for a closed lab/home network (no auth needed).
# For anything reachable beyond your LAN, see Челендж 2 (username/password) in
# the project write-up before using this config as-is.

allow_anonymous true

listener 1883

listener 9001
protocol websockets
